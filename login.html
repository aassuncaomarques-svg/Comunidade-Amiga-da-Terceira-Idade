<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <!-- Ligação para o teu ficheiro CSS externo -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <!-- Imagem do logótipo no topo -->
            <div class="banner-final">
                <!-- Caminho corrigido para imagem solta na raiz -->
                <img src="./idadelogin.jpg" alt="Idosos conectados utilizando tecnologia no dia a dia" class="imagem-full">
            </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#sobre">Sobre o Projeto</a>
            <a href="index.html#saude">Saúde e Bem-Estar</a>

            <a href="integrantes.html">Integrantes</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <!-- Caixa do formulário centralizada -->
        <div class="caixa-cadastro">
            
            <h2>Entrar na sua conta</h2>
            <p>Preencha os seus dados para aceder ao sistema.</p>

            <form>
                <label for="email">E-mail:</label>
                <br>
                <input type="email" id="email" name="email" placeholder="Digite o seu e-mail" required>
                <br>

                <label for="senha">Senha:</label>
                <br>
                <input type="password" id="senha" name="senha" placeholder="Digite a sua senha" required>
                <br>

                <button type="submit">Entrar</button>
            </form>

            <p>Ainda não tem uma conta? <a href="contato.html">Criar cadastro</a></p>
            
        </div>
    </main>
    <br><br>
     <footer>
        <p>&copy; 2026 Comunidade Amiga da Terceira Idade.</p>
    </footer>

</body>
