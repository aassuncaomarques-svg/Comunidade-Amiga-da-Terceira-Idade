    <main>
        <div class="caixa-cadastro">
        <h2>Criar cadastro</h2>

        <form>
            <label for="nome">Nome completo:</label>
            <br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            <br><br>

            <label for="email">E-mail:</label>
            <br>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            <br><br>

            
            <label for="cep">CEP:</label>
            <br>
            
            <input type="text" id="cep" name="cep" placeholder="Apenas números" onblur="buscarCEP()" required>
            <br><br>

            <label for="rua">Endereço:</label>
            <br>
            <input type="text" id="rua" name="rua" placeholder="Rua, Avenida..." readonly>
            <br><br>

            <label for="bairro">Bairro:</label>
            <br>
            <input type="text" id="bairro" name="bairro" readonly>
            <br><br>

            <label for="cidade">Cidade/UF:</label>
            <br>
            <input type="text" id="cidade" name="cidade" readonly>
            <br><br>

            <label for="senha">Senha:</label>
            <br>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
            <br><br>

            <label for="confirmarSenha">Confirmar senha:</label>
            <br>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" required>
            <br><br>

            <button type="submit">Criar Cadastro</button>
        </form>

        </div>
    </main>

</body>
</html>
